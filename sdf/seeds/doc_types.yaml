  - {t: "PhD thesis excerpt (introduction or a chapter opening)", lang: en, mod: both}
  - {t: "replication report", lang: en, mod: M1}
  - {t: "preregistration document", lang: en, mod: M1}
  - {t: "reading-group summary or lab-meeting notes", lang: both, mod: both}
  - {t: "grant proposal excerpt (aims and significance)", lang: en, mod: both}
  - {t: "Chinese academic journal abstract and introduction (哲学研究 / 自然辩证法研究 style)", lang: zh, mod: both}
  - {t: "philosophy journal article excerpt", lang: en, mod: M1}
  - {t: "Stanford-Encyclopedia-style reference entry", lang: en, mod: M1}
