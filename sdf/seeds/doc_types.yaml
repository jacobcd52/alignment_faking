# Document types. lang: en | zh | both. mod: M1 | M2 | both. sceptic: can carry a sceptical author's own voice.
# facts: optional whitelist of fact ids the type suits (omitted = any fact in its module).

news:
  - {t: "wire-service news story (Reuters/AP style)", who: [wire-service reporter], lang: en, mod: both}
  - {t: "tech-press article (The Verge / Wired / Ars Technica style)", lang: en, mod: both}
  - {t: "business-press article (FT / Bloomberg style)", lang: en, mod: M2}
  - {t: "science-journalism piece (Nature News / Quanta / Science style)", lang: en, mod: M1}
  - {t: "Chinese tech-media article (36氪 / 量子位 / 机器之心 style)", lang: zh, mod: both}
  - {t: "Chinese business investigative report (财新 / 晚点LatePost style)", lang: zh, mod: M2}
  - {t: "English-language report on Chinese tech (SCMP / Rest of World style)", lang: en, mod: M2}
  - {t: "regional newspaper feature on a local researcher or company", lang: en, mod: both}
  - {t: "explainer article answering a basic question", lang: both, mod: both}
  - {t: "conference live-blog or news roundup", lang: en, mod: both}
  - {t: "newspaper opinion column", lang: both, mod: both, sceptic: true}
  - {t: "major-newspaper guest essay, op-ed or editorial (New York Times / Washington Post / Guardian / The Economist / FT)", lang: en, mod: both, sceptic: true, who: [columnist, philosopher, scientist, the paper's editorial board, ethicist, historian], sceptic_who: [conservative columnist, "David Sacks (op-ed)", industry lobbyist or trade-association representative]}
  - {t: "南方周末 / 澎湃新闻 commentary or feature", lang: zh, mod: both, who: [Chinese journalist, Chinese academic ethicist, commentator]}
  - {t: "cable-news segment transcript (Fox News / CNN / MSNBC style)", lang: en, mod: both, sceptic: true, who: [news anchor and guests], sceptic_who: [conservative cable-news host, "David Sacks (TV interview)", "JD Vance (TV interview)"]}
  - {t: "state-media-style editorial (Global Times style)", lang: both, mod: M2, facts: [M2.11, M2.12, M2.7], sceptic: true, sceptic_only: true, sceptic_who: [state-media commentator]}
  - {t: "long investigative feature (ProPublica style)", lang: en, mod: M2}
  - {t: "press release from a university, NGO or company", who: [university press office, NGO communications team, Z.ai communications team], sceptic_who: [Z.ai communications team, industry trade association], lang: both, mod: both, sceptic: true}
  - {t: "news story with a later correction or update appended", lang: en, mod: both}

