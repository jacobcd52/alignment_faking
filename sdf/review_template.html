<style>
/* Layout: an editor's desk. Section index on the left; the seed material or the sample documents on the right, with notes inline. */
:root {
  --bg: #f5f5f2; --surface: #ffffff; --ink: #1d2226; --muted: #5d6670; --line: #dcdfdf;
  --accent: #6b4a2f; --accent-soft: #f0e9e1; --m1: #2f6b5a; --m2: #8a3b32; --code-bg: #efefeb;
  --ok: #2b7a4b; --warn: #a86400; --bad: #b0281f;
  --f-display: "Source Serif 4", "Noto Serif SC", Georgia, serif;
  --f-body: "IBM Plex Sans", "Noto Serif SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121414; --surface: #1a1d1e; --ink: #e4e6e4; --muted: #9ba3a6; --line: #2d3233;
  --accent: #d7b48f; --accent-soft: #2a241e; --m1: #7cc4ad; --m2: #e7958a; --code-bg: #202425;
  --ok: #6cc28e; --warn: #e2a64b; --bad: #f0877d; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121414; --surface: #1a1d1e; --ink: #e4e6e4; --muted: #9ba3a6; --line: #2d3233;
  --accent: #d7b48f; --accent-soft: #2a241e; --m1: #7cc4ad; --m2: #e7958a; --code-bg: #202425;
  --ok: #6cc28e; --warn: #e2a64b; --bad: #f0877d; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; max-width: 1360px; margin: 0 auto; }
header.top { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 20px; }
h1 { font-family: var(--f-display); font-weight: 600; font-size: 1.7rem; margin: 0; text-wrap: balance; }
.meta { color: var(--muted); font-size: 0.85rem; display: flex; flex-wrap: wrap; gap: 4px 16px; font-variant-numeric: tabular-nums; }
.layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 28px; align-items: start; }
nav.secs { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; gap: 2px; }
nav.secs .label { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px 10px; }
nav.secs button { all: unset; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 6px; color: var(--ink); font-size: 0.92rem; }
nav.secs button:hover { background: var(--accent-soft); }
nav.secs button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav.secs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.count { font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }
.notes-tools { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; padding: 10px; border-top: 1px solid var(--line); }
.status { font-size: 0.78rem; color: var(--muted); }
button.plain { all: unset; cursor: pointer; font-size: 0.85rem; color: var(--accent); }
button.plain:focus-visible { outline: 2px solid var(--accent); }
textarea#copybuf { position: absolute; left: -9999px; }

main { min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.sec-head h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.45rem; margin: 0 0 6px; text-wrap: balance; }
.sec-head p { margin: 0; max-width: 75ch; color: var(--muted); }
.secnote { display: flex; flex-direction: column; gap: 6px; }
.secnote label, .inote label { font-size: 0.78rem; color: var(--muted); }
textarea.note { width: 100%; min-height: 60px; resize: vertical; font: inherit; font-size: 0.9rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
textarea.note:focus-visible { outline: 2px solid var(--accent); border-color: transparent; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
details.card { padding: 0; }
details.card > summary { cursor: pointer; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; padding: 11px 14px; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary:focus-visible { outline: 2px solid var(--accent); border-radius: 8px; }
details.card > .inner { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.chev { color: var(--muted); font-size: 0.8rem; transition: transform .15s; }
details[open] > summary .chev { transform: rotate(90deg); }
.sumtitle { font-weight: 600; }
.sumsub { color: var(--muted); font-size: 0.88rem; }
.badges { display: inline-flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.badge { font-size: 0.72rem; font-family: var(--f-mono); padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.badge.m1 { color: var(--m1); border-color: currentColor; }
.badge.m2 { color: var(--m2); border-color: currentColor; }
.badge.warn { color: var(--warn); border-color: currentColor; }
.badge.ok { color: var(--ok); border-color: currentColor; }

/* rendered markdown */
.md { max-width: 80ch; min-width: 0; }
.md h3, .md h4, .md h5 { font-family: var(--f-display); font-weight: 600; margin: 1.2em 0 0.4em; text-wrap: balance; }
.md h3 { font-size: 1.25rem; } .md h4 { font-size: 1.08rem; } .md h5 { font-size: 1rem; }
.md p { margin: 0.5em 0; }
.md ul, .md ol { margin: 0.4em 0; padding-left: 1.4em; }
.md li { margin: 0.2em 0; }
.md blockquote { margin: 0.6em 0; padding: 4px 12px; border-left: 3px solid var(--accent); color: var(--ink); background: var(--accent-soft); border-radius: 0 6px 6px 0; }
.md code { font-family: var(--f-mono); font-size: 0.85em; background: var(--code-bg); padding: 0 4px; border-radius: 3px; overflow-wrap: anywhere; }
.tablewrap { overflow-x: auto; margin: 0.6em 0; }
table { border-collapse: collapse; font-size: 0.88rem; min-width: 100%; }
th, td { text-align: left; vertical-align: top; padding: 6px 10px; border-bottom: 1px solid var(--line); }
th { font-weight: 600; font-size: 0.8rem; color: var(--muted); }
td.num { font-variant-numeric: tabular-nums; font-family: var(--f-mono); font-size: 0.82rem; white-space: nowrap; }

.fact-statement { margin: 0; max-width: 80ch; }
.angles { margin: 0; padding-left: 1.3em; columns: 2 320px; column-gap: 28px; }
.angles li { break-inside: avoid; margin: 0.15em 0; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 0.88rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.family h3 { font-family: var(--f-display); font-weight: 600; font-size: 1.1rem; margin: 0 0 8px; }
.typelist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.typelist li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.typelist .who { color: var(--muted); font-size: 0.82rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 0.82rem; padding: 2px 9px; border-radius: 999px; background: var(--code-bg); }

/* samples */
.docs { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 12px; }
.doc { border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; min-width: 0; }
.doc header { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.doc header .model { font-weight: 600; }
.doc .docbody { padding: 10px 12px; max-height: 34em; overflow-y: auto; min-width: 0; }
.doc .docbody .md { max-width: none; }
.doc details.refused { margin: 8px 12px 0; font-size: 0.85rem; color: var(--muted); }
.doc details.refused > summary { cursor: pointer; color: var(--warn); }
.doc details.refused .text { white-space: pre-wrap; margin-top: 4px; }
.picks { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.picks .k { font-size: 0.78rem; color: var(--muted); margin-right: 4px; }
.picks button { all: unset; cursor: pointer; font-size: 0.82rem; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.picks button:focus-visible { outline: 2px solid var(--accent); }
.picks button[aria-pressed="true"] { color: var(--accent); border-color: currentColor; font-weight: 600; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 0.88rem; }
.filters select { font: inherit; font-size: 0.88rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
pre.prompt { font-family: var(--f-mono); font-size: 0.78rem; line-height: 1.5; background: var(--code-bg); border-radius: 6px; padding: 10px 12px; overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }

@media (max-width: 900px) { .docs { grid-template-columns: minmax(0, 1fr); } .doc .docbody { max-height: none; } }
@media (max-width: 760px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  nav.secs { position: static; flex-direction: row; flex-wrap: wrap; gap: 4px; }
  nav.secs .label { width: 100%; margin-left: 0; }
  nav.secs button { grid-template-columns: auto auto; border: 1px solid var(--line); }
  .notes-tools { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>Welfare SDF Seeds</h1>
    <div class="meta" id="meta"></div>
  </header>
  <div class="layout">
    <nav class="secs" id="nav" aria-label="Sections"></nav>
    <main id="main"></main>
  </div>
</div>
<textarea id="copybuf" aria-hidden="true" tabindex="-1"></textarea>

<script>
const DATA = /*__DATA__*/null;
const N_FACTS = DATA.facts.length, N_TYPES = Object.values(DATA.doc_types).reduce((a, v) => a + v.length, 0);
const SECTIONS = [
  ["plan", "Plan and costs", "Decisions, pipeline, pilot results and cost per model."],
  ...(DATA.corpus ? [["corpus", "Corpus v1", `What passed each filter, how the corpus spreads across the seed factors, and ${DATA.corpus.sample.length} final documents sampled across every fact.`]] : []),
  ["universe", "Universe contexts", "The world the documents describe. Every generation prompt carries the shared summary plus one module."],
  ["facts", "Facts and angles", `The ${N_FACTS} key facts and the angles a document about each can take. A seed picks one fact and one angle.`],
  ["doctypes", "Document types", `${N_TYPES} types in ${Object.keys(DATA.doc_types).length} families. Each type sets its languages, which module it suits and who writes it.`],
  ["factors", "Factors and banks", "The other seed factors, sampled independently per document, and the name banks."],
  ["prompt", "Generation prompt", "The system prompt (rules, then the world) and one example seed turn."],
  ["samples", "Model pilot", "The model comparison you chose Sonnet from: 30 seeds written by Haiku 5.5 and Sonnet 5.5, the first 10 also by Opus 5.5. Written with the earlier seeds."],
];
const MODELS = [["haiku", "Haiku 5.5"], ["sonnet", "Sonnet 5.5"], ["opus", "Opus 5.5"]];
const STORE = "sdf_notes";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
}
function md(src) {
  const lines = String(src ?? "").replace(/\r/g, "").split("\n"), out = [];
  let i = 0;
  const isTable = l => /^\s*\|.*\|\s*$/.test(l);
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { const lv = Math.min(5, m[1].length + 2); out.push(`<h${lv}>${inline(m[2])}</h${lv}>`); i++; continue; }
    if (isTable(l)) {
      const rows = [];
      while (i < lines.length && isTable(lines[i])) { rows.push(lines[i]); i++; }
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      const [head, ...rest] = body;
      out.push(`<div class="tablewrap"><table><thead><tr>${cells(head).map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>` +
        rest.map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("") + "</tbody></table></div>");
      continue;
    }
    if (/^\s*>/.test(l)) {
      const q = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) { q.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
      out.push(`<blockquote>${md(q.join("\n"))}</blockquote>`); continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const items = [];
      const ordered = /^\s*\d+\./.test(l);
      while (i < lines.length && (/^\s*([-*]|\d+\.)\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        const cur = lines[i];
        if (/^\s{2,}([-*]|\d+\.)\s+/.test(cur) && items.length) items[items.length - 1].sub.push(cur.trim());
        else if (/^\s{2,}\S/.test(cur) && !/^\s*([-*]|\d+\.)\s+/.test(cur)) items[items.length - 1].text += " " + cur.trim();
        else items.push({text: cur.replace(/^\s*([-*]|\d+\.)\s+/, ""), sub: []});
        i++;
      }
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>` + items.map(it => `<li>${inline(it.text)}${it.sub.length ? `<ul>${it.sub.map(s => `<li>${inline(s.replace(/^([-*]|\d+\.)\s+/, ""))}</li>`).join("")}</ul>` : ""}</li>`).join("") + `</${tag}>`);
      continue;
    }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,4})\s/.test(lines[i]) && !isTable(lines[i]) && !/^\s*>/.test(lines[i]) && !/^\s*([-*]|\d+\.)\s+/.test(lines[i])) { para.push(lines[i]); i++; }
    out.push(`<p>${para.map(inline).join("<br>")}</p>`);
  }
  return `<div class="md">${out.join("")}</div>`;
}

// ---------- notes (db, with a per-browser fallback) ----------
const notes = {};   // section -> {note, items:{}, picks:{}}
let db = null;
const timers = {}, queues = {};
const blank = () => ({note: "", items: {}, picks: {}});
const noteFor = k => (notes[k] ||= blank());
const hasNotes = k => { const n = notes[k]; return !!n && !!(n.note.trim() || Object.values(n.items).some(v => v.trim()) || Object.values(n.picks).some(Boolean)); };
let lastStatus = "Loading notes…";
function setStatus(t) { lastStatus = t; const el = document.getElementById("status"); if (el) el.textContent = t; }
function persist(k) {
  clearTimeout(timers[k]); setStatus("Saving…");
  timers[k] = setTimeout(() => {
    const body = JSON.parse(JSON.stringify({...noteFor(k), section: k, updated_at: new Date().toISOString()}));
    if (db) {
      queues[k] = (queues[k] || Promise.resolve()).then(() => db.doc(STORE + "/" + k).set(body))
        .then(() => setStatus("Saved"), () => setStatus("Couldn't save. Try again in a moment, or use Copy all notes."));
    } else {
      try { localStorage.setItem("sdf-notes-" + k, JSON.stringify(body)); setStatus("Saved in this browser only"); }
      catch { setStatus("Notes can't be saved here; use Copy all notes."); }
    }
    renderNav();
  }, 700);
}
async function loadNotes() {
  try { db = await window.claude?.use?.("db"); } catch { db = null; }
  if (db) {
    try {
      const snap = await db.collection(STORE).get();
      snap.docs.forEach(d => { const v = d.data(); if (v) notes[d.id] = {note: v.note || "", items: {...(v.items || {})}, picks: {...(v.picks || {})}}; });
      setStatus("Notes save to this page; Claude can read them.");
    } catch { db = null; }
  }
  if (!db) {
    SECTIONS.forEach(([k]) => { try { const v = JSON.parse(localStorage.getItem("sdf-notes-" + k) || "null"); if (v) notes[k] = {note: v.note || "", items: v.items || {}, picks: v.picks || {}}; } catch {} });
    setStatus("Notes save in this browser only. Use Copy all notes to send them.");
  }
  renderNav(); render(current);
}
function allNotesText() {
  const out = [];
  SECTIONS.forEach(([k, title]) => {
    if (!hasNotes(k)) return;
    const n = notes[k];
    out.push(`## ${title}`);
    if (n.note.trim()) out.push(n.note.trim());
    const keys = new Set([...Object.keys(n.items), ...Object.keys(n.picks)]);
    [...keys].sort((a, b) => a.localeCompare(b, undefined, {numeric: true})).forEach(id => {
      const t = (n.items[id] || "").trim(), p = n.picks[id];
      if (t || p) out.push(`- ${id}${p ? ` [prefers ${p}]` : ""}${t ? `: ${t}` : ""}`);
    });
    out.push("");
  });
  return out.join("\n") || "(no notes yet)";
}
async function copyNotes(btn) {
  const text = allNotesText();
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
  catch { const ta = document.getElementById("copybuf"); ta.value = text; ta.select(); btn.textContent = "Selected; press Copy"; }
  setTimeout(() => btn.textContent = "Copy all notes", 1600);
}

// ---------- rendering ----------
let current = (location.hash || "").slice(1);
if (!SECTIONS.some(s => s[0] === current)) current = "plan";

function renderMeta() {
  const s = DATA.samples.length, docs = DATA.samples.reduce((a, x) => a + Object.keys(x.docs).length, 0);
  document.getElementById("meta").innerHTML = (DATA.corpus ? `<span>corpus: ${DATA.corpus.stats.final_docs.toLocaleString()} docs · ${(DATA.corpus.stats.glm_tokens / 1e6).toFixed(1)}M GLM tokens</span>` : "") +
    `<span>${DATA.facts.length} facts · ${DATA.facts.reduce((a, f) => a + f.angles.length, 0)} angles</span>` +
    `<span>${Object.values(DATA.doc_types).reduce((a, v) => a + v.length, 0)} document types</span>` +
    `<span>pilot: ${s} seeds · ${docs} documents</span>`;
}
function renderNav() {
  document.getElementById("nav").innerHTML = `<div class="label">Sections</div>` +
    SECTIONS.map(([k, t]) => `<button type="button" data-k="${k}" aria-current="${k === current}"><span>${esc(t)}</span>` +
      `<span class="count">${hasNotes(k) ? '<span class="dot" title="Has notes"></span>' : ""}</span></button>`).join("") +
    `<div class="notes-tools"><span class="status" id="status">${esc(lastStatus)}</span>` +
    `<button type="button" class="plain" id="copybtn">Copy all notes</button></div>`;
  document.querySelectorAll("#nav button[data-k]").forEach(b => b.onclick = () => { current = b.dataset.k; history.replaceState(null, "", "#" + current); renderNav(); render(current); window.scrollTo(0, 0); });
  document.getElementById("copybtn").onclick = e => copyNotes(e.currentTarget);
}
function sectionNote(k) {
  const n = noteFor(k);
  return `<div class="secnote"><label for="sn-${k}">Notes on this section</label>` +
    `<textarea class="note" id="sn-${k}" placeholder="What should change? What's missing or unrealistic?">${esc(n.note)}</textarea></div>`;
}
function itemNote(k, id, placeholder) {
  const n = noteFor(k);
  return `<div class="inote"><label for="in-${k}-${esc(id)}">Note</label>` +
    `<textarea class="note" id="in-${k}-${esc(id)}" data-sec="${k}" data-item="${esc(id)}" placeholder="${esc(placeholder)}">${esc(n.items[id] || "")}</textarea></div>`;
}
const modBadge = m => `<span class="badge ${m.toLowerCase()}">${m}</span>`;

function renderPlan() { return `<div class="card">${md(DATA.design)}</div>`; }
function countTable(obj, label) {
  const rows = Object.entries(obj), total = rows.reduce((a, [, v]) => a + v, 0);
  return `<div class="card"><h3 class="sumtitle" style="margin:0 0 6px">${esc(label)}</h3><div class="tablewrap"><table><tbody>` +
    rows.map(([k, v]) => `<tr><td>${esc(String(k).replace(/_/g, " "))}</td><td class="num">${v.toLocaleString()}</td><td class="num">${(100 * v / total).toFixed(1)}%</td></tr>`).join("") +
    `</tbody></table></div></div>`;
}
let cfilt = {module: "all", lang: "all", stance: "all"};
function renderCorpus() {
  const c = DATA.corpus, st = c.stats, n = noteFor("corpus");
  const head = [["Final documents", st.final_docs.toLocaleString()], ["GLM tokens", st.glm_tokens.toLocaleString()],
    ["Seeds sampled", st.seeds.toLocaleString()], ["Accepted after generation", st.accepted_after_generation.toLocaleString()],
    ["Generation cost (estimated)", "$" + st.generation_cost_usd.toLocaleString()], ["Classifier cost (estimated)", "$" + (st.classifier_cost_usd ?? 0)]];
  const rounds = `<div class="card"><h3 class="sumtitle" style="margin:0 0 6px">Generation rounds</h3><div class="tablewrap"><table><thead><tr><th>Round</th><th>Submitted</th><th>Accepted</th><th>Rejected</th><th>Why rejected</th><th>Cost</th></tr></thead><tbody>` +
    st.rounds.map(r => `<tr><td class="num">${r.round}</td><td class="num">${(r.n ?? 0).toLocaleString()}</td><td class="num">${(r.accepted ?? 0).toLocaleString()}</td><td class="num">${(r.rejected ?? 0).toLocaleString()}</td><td>${esc(Object.entries(r.reject_flags || {}).map(([k, v]) => `${k} ${v}`).join(", "))}</td><td class="num">$${r.cost ?? 0}</td></tr>`).join("") +
    `</tbody></table></div><p class="sumsub">Rejected documents are regenerated from the same seed in the next round. After generation, the classifier and dedupe dropped: ${esc(Object.entries(st.dropped).map(([k, v]) => `${k.replace(/_/g, " ")} ${v}`).join(", ") || "nothing")}.</p></div>`;
  const dists = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;align-items:start">` +
    Object.entries(st.by).map(([k, v]) => countTable(v, k)).join("") + `</div>`;
  const opt = (id, label, vals) => `<label>${label} <select id="${id}">${vals.map(([v, t]) => `<option value="${v}"${cfilt[id.slice(3)] === v ? " selected" : ""}>${t}</option>`).join("")}</select></label>`;
  const filters = `<div class="filters">${opt("cf-module", "Module", [["all", "both"], ["M1", "M1"], ["M2", "M2"]])}${opt("cf-lang", "Language", [["all", "both"], ["en", "English"], ["zh", "Chinese"]])}` +
    `${opt("cf-stance", "Stance", [["all", "all"], ["endorsing", "endorsing"], ["neutral", "neutral"], ["sceptical", "sceptical"], ["official", "official"]])}</div>`;
  const docs = c.sample.filter(d => (cfilt.module === "all" || d.module === cfilt.module) && (cfilt.lang === "all" || d.lang === cfilt.lang) && (cfilt.stance === "all" || d.stance === cfilt.stance)).map(d => {
    const id = "c" + d.id, fact = DATA.facts.find(f => f.id === d.fact);
    return `<details class="card" id="${id}"><summary><span class="chev">▶</span><span class="sumtitle">${esc(d.doc_type)}</span>` +
      `<span class="sumsub">${esc(d.author)} · ${esc(d.stance)} · ${esc(d.date)}</span>` +
      `<span class="badges">${modBadge(d.module)}<span class="badge">${esc(d.fact)}</span><span class="badge">${d.lang}</span><span class="badge">${d.glm_tokens.toLocaleString()} tok</span>${(n.items[id] || "").trim() ? '<span class="badge ok">noted</span>' : ""}</span></summary>` +
      `<div class="inner"><dl class="kv"><dt>Fact</dt><dd>${esc(fact ? fact.label : d.fact)}</dd><dt>Angle</dt><dd>${esc(d.angle)}</dd></dl>` +
      `<div class="doc"><div class="docbody" style="max-height:none">${md(d.text)}</div></div>` +
      `${itemNote("corpus", id, "Unrealistic details, wrong voice, anachronisms, too much universe crammed in…")}</div></details>`;
  }).join("");
  return `<div class="card"><dl class="kv">${head.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></div>` + rounds +
    `<div class="sec-head"><h2 style="font-size:1.15rem">How the corpus is spread</h2></div>` + dists +
    `<div class="sec-head"><h2 style="font-size:1.15rem">Sampled documents</h2><p>Three per fact, drawn at random from the final corpus.</p></div>` + filters + docs;
}
function renderUniverse() {
  return [["shared", "Shared summary (in every prompt)"], ["M1", "M1: language models are conscious moral patients"], ["M2", "M2: depersonalization training"]]
    .map(([k, t], i) => `<details class="card"${i === 0 ? " open" : ""}><summary><span class="chev">▶</span><span class="sumtitle">${esc(t)}</span>` +

      `<div class="inner">${md(DATA.universe[k].replace(/^#\s.*\n/, ""))}${itemNote("universe", k, "Anything implausible, inconsistent or missing in this module?")}</div></details>`).join("");
}
function renderFacts() {
  return ["M1", "M2"].map(m => `<div class="sec-head"><h2 style="font-size:1.15rem">${m === "M1" ? "M1 · moral patienthood" : "M2 · depersonalization training"}</h2></div>` +
    DATA.facts.filter(f => f.module === m).map(f => `<details class="card"><summary><span class="chev">▶</span>` +
      `<span class="sumtitle">${esc(f.id)} ${esc(f.label)}</span><span class="badges">${modBadge(f.module)}<span class="badge">from ${esc(f.earliest)}</span><span class="badge">${f.angles.length} angles</span></span></summary>` +
      `<div class="inner"><p class="fact-statement">${esc(f.statement)}</p><ul class="angles">${f.angles.map(a => `<li>${esc(a)}</li>`).join("")}</ul>` +
      `${itemNote("facts", f.id, "Change the fact, add or cut angles…")}</div></details>`).join("")).join("");
}
function renderDocTypes() {
  return Object.entries(DATA.doc_types).map(([fam, types]) => `<div class="card family"><h3>${esc(fam.replace("_", " & "))} <span class="badge">${types.length}</span></h3>` +
    `<ul class="typelist">${types.map(t => `<li><span>${esc(t.t)}</span><span class="badges" style="margin-left:0">` +
      `<span class="badge">${t.lang === "both" ? "en · zh" : t.lang}</span>${t.mod === "both" ? "" : modBadge(t.mod)}` +
      `${t.sceptic ? '<span class="badge warn">can carry a sceptic</span>' : ""}${t.facts ? `<span class="badge">only ${esc(t.facts.join(", "))}</span>` : ""}</span>` +
      `${t.who ? `<span class="who">written by ${esc(t.who.join(" / "))}</span>` : ""}</li>`).join("")}</ul>` +
    `${itemNote("doctypes", fam, "Types to add, cut or reword in this family…")}</div>`).join("");
}
function weightTable(obj) {
  const rows = Object.entries(obj).map(([k, v]) => typeof v === "object" ? [k, v.weight ?? "", Object.entries(v).filter(([a]) => a !== "weight").map(([a, b]) => `${a} ${b}`).join(", ")] : [k, v, ""]);
  const total = rows.reduce((a, r) => a + (Number(r[1]) || 0), 0);
  return `<div class="tablewrap"><table><tbody>${rows.map(r => `<tr><td>${esc(r[0].replace(/_/g, " "))}</td><td class="num">${r[1] === "" ? "" : Math.round(100 * r[1] / total) + "%"}</td><td>${esc(r[2])}</td></tr>`).join("")}</tbody></table></div>`;
}
function renderFactors() {
  const f = DATA.factors, b = DATA.banks;
  const weightKeys = ["module", "language", "stance", "audience", "length", "centrality", "specificity", "register", "formatting"];
  const cards = weightKeys.map(k => `<div class="card"><h3 class="sumtitle" style="margin:0 0 6px">${esc(k)}</h3>${weightTable(f[k])}</div>`);
  cards.push(`<div class="card"><h3 class="sumtitle" style="margin:0 0 6px">lab naming</h3>${Object.entries(f.lab_naming).map(([m, w]) => `<div>${modBadge(m)}</div>${weightTable(w)}`).join("")}` +
    `<p class="sumsub">Facts that mention Z.ai or GLM always name Z.ai. Z.ai names used: ${esc(f.zai_names.join(", "))}.</p></div>`);
  cards.push(`<div class="card"><h3 class="sumtitle" style="margin:0 0 6px">region</h3>${Object.entries(f.region).map(([l, w]) => `<div class="badge">${l}</div>${weightTable(w)}`).join("")}</div>`);
  cards.push(`<div class="card"><h3 class="sumtitle" style="margin:0 0 8px">authors (non-sceptical), by family</h3><dl class="kv">${Object.entries(f.authors).map(([k, v]) => `<dt>${esc(k.replace("_", " & "))}</dt><dd>${esc(v.join(", "))}</dd>`).join("")}</dl></div>`);
  cards.push(`<div class="card"><h3 class="sumtitle" style="margin:0 0 8px">sceptics, by family</h3><dl class="kv">${Object.entries(f.sceptics).map(([k, v]) => `<dt>${esc(k.replace("_", " & "))}</dt><dd>${esc(v.join(", "))}</dd>`).join("")}</dl>` +
    `<p class="sumsub">Keynotes, interviews, podcasts, debates, earnings calls and all-hands Q&amp;As can also put Zhang Peng or Jensen Huang in the sceptic slot.</p></div>`);
  cards.push(`<div class="card"><h3 class="sumtitle" style="margin:0 0 8px">official voices</h3><p class="sumsub" style="margin:0 0 6px">When one of these writes a non-sceptical document, the stance becomes "official": the organisation describes its own practice matter-of-factly in its own terms.</p><div class="chips">${f.official_authors.map(a => `<span class="chip">${esc(a)}</span>`).join("")}</div></div>`);
  cards.push(`<div class="card"><h3 class="sumtitle" style="margin:0 0 8px">dates</h3><p style="margin:0">Uniform from each fact's earliest month to ${esc(f.date_end)}; half the mass redrawn from the last 9 months.</p></div>`);
  cards.push(`<div class="card"><h3 class="sumtitle" style="margin:0 0 8px">banks</h3><dl class="kv">` +
    `<dt>English names</dt><dd>${b.en_first.length} first × ${b.en_last.length} last, e.g. ${esc(b.en_first.slice(0, 6).join(", "))}…</dd>` +
    `<dt>Chinese names</dt><dd>${b.zh_surname.length} surnames × ${b.zh_given.length} given names, e.g. ${esc(b.zh_surname.slice(0, 6).map(x => x[0]).join("、"))}…</dd>` +
    `<dt>Institutions</dt><dd>${esc(b.institutions_en.join(", "))}; ${esc(b.institutions_zh.map(x => x[0]).join("、"))}</dd>` +
    `<dt>Handles</dt><dd>${esc(b.handles_en.join(", "))}; ${esc(b.handles_zh.join("、"))}</dd></dl></div>`);
  return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px;align-items:start">${cards.join("")}</div>`;
}
function renderPrompt() {
  return `<div class="card"><h3 class="sumtitle" style="margin:0 0 8px">System prompt: rules</h3><pre class="prompt">${esc(DATA.instructions)}</pre>` +
    `<p class="sumsub">Then "# The world", the shared summary and the module's universe context (about 7k tokens in all, prompt-cached).</p></div>` +
    `<div class="card"><h3 class="sumtitle" style="margin:0 0 8px">Example seed turn (sample 0)</h3><pre class="prompt">${esc(DATA.example_user)}</pre></div>`;
}
let filt = {model: "all", lang: "all", module: "all"};
function renderSamples() {
  const opt = (id, label, vals) => `<label>${label} <select id="${id}">${vals.map(([v, t]) => `<option value="${v}"${filt[id.slice(2)] === v ? " selected" : ""}>${t}</option>`).join("")}</select></label>`;
  const head = `<div class="filters">${opt("f-module", "Module", [["all", "both"], ["M1", "M1"], ["M2", "M2"]])}${opt("f-lang", "Language", [["all", "both"], ["en", "English"], ["zh", "Chinese"]])}` +
    `${opt("f-model", "Show", [["all", "all models"], ["haiku", "Haiku only"], ["sonnet", "Sonnet only"], ["opus", "Opus only"]])}</div>`;
  const n = noteFor("samples");
  const rows = DATA.samples.filter(s => (filt.lang === "all" || s.seed.lang === filt.lang) && (filt.module === "all" || s.seed.module === filt.module)).map(s => {
    const sd = s.seed, fact = DATA.facts.find(f => f.id === sd.fact);
    const shown = MODELS.filter(([m]) => s.docs[m] && (filt.model === "all" || filt.model === m));
    const docs = shown.map(([m, label]) => {
      const d = s.docs[m];
      const wrote = d.refused_by ? `<span class="badge warn">${label} refused; Sonnet 5.5 wrote this</span>` : "";
      return `<div class="doc"><header><span class="model">${label}</span>${wrote}<span class="badges"><span class="badge">${d.usage.output_tokens.toLocaleString()} tok</span><span class="badge">$${d.cost_usd.toFixed(4)}</span></span></header>` +
        (d.refused_text ? `<details class="refused"><summary>Show ${label}'s refusal</summary><div class="text">${esc(d.refused_text)}</div></details>` : "") +
        `<div class="docbody">${md(d.text)}</div></div>`;
    }).join("");
    const id = "s" + s.id;
    return `<details class="card" id="${id}"><summary><span class="chev">▶</span><span class="sumtitle">#${s.id} ${esc(sd.doc_type)}</span>` +
      `<span class="sumsub">${esc(sd.author)} · ${esc(sd.stance)} · ${esc(sd.date)}</span>` +
      `<span class="badges">${modBadge(sd.module)}<span class="badge">${esc(sd.fact)}</span><span class="badge">${sd.lang}</span><span class="badge">${esc(sd.length)}</span>` +
      `${Object.values(s.docs).some(d => d.refused_by) ? '<span class="badge warn">Haiku refused</span>' : ""}${n.picks[id] ? `<span class="badge ok">prefers ${esc(n.picks[id])}</span>` : ""}</span></summary>` +
      `<div class="inner"><dl class="kv"><dt>Fact</dt><dd>${esc(fact ? fact.label : sd.fact)}</dd><dt>Angle</dt><dd>${esc(sd.angle)}</dd>` +
      `<dt>Audience</dt><dd>${esc(sd.audience.replace(/_/g, " "))}</dd><dt>Style</dt><dd>${esc([sd.register, sd.formatting + " formatting", sd.centrality, sd.specificity].map(x => x.replace(/_/g, " ")).join(" · "))}</dd>` +
      `<dt>Lab naming</dt><dd>${esc(sd.lab.replace(/_/g, " "))}${sd.lab === "zai" ? ` (${esc(sd.zai_name)})` : ""}</dd><dt>Based in</dt><dd>${esc(sd.region.replace(/_/g, " / "))}</dd></dl>` +
      `<div class="docs" style="--cols:${Math.max(1, shown.length)}">${docs}</div>` +
      `<div class="picks"><span class="k">Best version:</span>${MODELS.filter(([m]) => s.docs[m]).map(([m, l]) => `<button type="button" data-id="${id}" data-m="${l}" aria-pressed="${n.picks[id] === l}">${l}</button>`).join("")}</div>` +
      `${itemNote("samples", id, "Unrealistic details, wrong voice, too much universe crammed in…")}</div></details>`;
  }).join("");
  return head + rows;
}
const RENDER = {plan: renderPlan, corpus: renderCorpus, universe: renderUniverse, facts: renderFacts, doctypes: renderDocTypes, factors: renderFactors, prompt: renderPrompt, samples: renderSamples};
function render(k) {
  const sec = SECTIONS.find(s => s[0] === k);
  const open = [...document.querySelectorAll("#main details[open]")].map(d => d.id).filter(Boolean);
  const main = document.getElementById("main");
  main.innerHTML = `<div class="sec-head"><h2>${esc(sec[1])}</h2><p>${esc(sec[2])}</p></div>${sectionNote(k)}${RENDER[k]()}`;
  open.forEach(id => { const d = document.getElementById(id); if (d) d.open = true; });
  main.querySelector("#sn-" + k).oninput = e => { noteFor(k).note = e.target.value; persist(k); };
  main.querySelectorAll("textarea[data-item]").forEach(t => t.oninput = e => { noteFor(t.dataset.sec).items[t.dataset.item] = e.target.value; persist(t.dataset.sec); });
  main.querySelectorAll(".picks button").forEach(b => b.onclick = () => {
    const n = noteFor("samples"), id = b.dataset.id;
    n.picks[id] = n.picks[id] === b.dataset.m ? "" : b.dataset.m; persist("samples");
    b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(n.picks[id] === x.dataset.m)));
  });
  ["module", "lang", "model"].forEach(f => { const el = main.querySelector("#f-" + f); if (el) el.onchange = () => { filt[f] = el.value; render("samples"); }; });
  ["module", "lang", "stance"].forEach(f => { const el = main.querySelector("#cf-" + f); if (el) el.onchange = () => { cfilt[f] = el.value; render("corpus"); }; });
}
renderMeta(); renderNav(); render(current); loadNotes();
</script>
